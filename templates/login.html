<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURE ACCESS // EARTHSCAPE HQ</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- GSAP (GreenSock) + ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    
    <!-- Shared Monochrome Theme & GSAP Animation Engine -->
    <link rel="stylesheet" href="/static/css/theme.css">
    <script src="/static/js/animations.js" defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-main);
        }
        .login-box {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }
        .login-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 32px;
            box-shadow: var(--shadow-md);
        }
        .form-group { margin-bottom: 16px; }
        .form-label {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: var(--accent-black);
        }
        .role-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .role-option {
            padding: 10px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: var(--bg-main);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .role-option.selected {
            background: var(--accent-black);
            color: var(--bg-main);
            border-color: var(--accent-black);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div style="text-align:center; margin-bottom:28px;">
            <div style="font-size:2.4rem; margin-bottom:6px;">🌐</div>
            <h1 style="font-size:1.6rem; letter-spacing:2px;">EARTHSCAPE</h1>
            <div style="font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-secondary); margin-top:2px;">
                CLIMATE AGENCY // AUTHORIZED PERSONNEL PORTAL
            </div>
        </div>

        <div class="login-card">
            {% if error %}
            <div style="background:var(--accent-critical-bg); border:1px solid var(--accent-critical-border); color:var(--accent-critical); padding:10px 14px; border-radius:6px; font-family:'JetBrains Mono',monospace; font-size:0.75rem; margin-bottom:16px;">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label class="form-label">Username / Operator ID</label>
                    <input type="text" name="username" class="form-input" placeholder="admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <label class="form-label">Assigned Role</label>
                <div class="role-grid">
                    <div class="role-option selected" onclick="selectRole('ADMIN', this)">ADMIN</div>
                    <div class="role-option" onclick="selectRole('ANALYST', this)">ANALYST</div>
                </div>
                <input type="hidden" name="role" id="role-input" value="ADMIN">

                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:6px;">
                    AUTHENTICATE
                </button>
            </form>

            <div style="margin-top:20px; padding:12px; background:var(--bg-main); border:1px solid var(--border-color); border-radius:8px;">
                <div class="card-label" style="margin-bottom:8px;">Demo Credentials (Click to Fill)</div>
                <div style="display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-secondary); cursor:pointer; padding:4px 0;" onclick="fillCreds('admin','admin123')">
                    <span>ADMIN</span>
                    <b>admin / admin123</b>
                </div>
                <div style="display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--text-secondary); cursor:pointer; padding:4px 0;" onclick="fillCreds('analyst','analyst123')">
                    <span>ANALYST</span>
                    <b>analyst / analyst123</b>
                </div>
            </div>
        </div>

        <div style="display:flex; justify-content:center; gap:16px; margin-top:20px; font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--text-secondary);">
            <span>SECURITY: AES-256</span>
            <span>•</span>
            <span>AUTH: BCRYPT</span>
            <span>•</span>
            <button onclick="window.toggleTheme()" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; font-family:'JetBrains Mono',monospace; font-size:0.7rem;">TOGGLE THEME</button>
        </div>
    </div>

    <script>
        function selectRole(role, el) {
            document.querySelectorAll('.role-option').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('role-input').value = role;
        }
        function fillCreds(u, p) {
            document.querySelector('input[name=username]').value = u;
            document.querySelector('input[name=password]').value = p;
        }
    </script>
</body>
</html>
